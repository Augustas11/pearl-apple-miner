# SPDX-License-Identifier: Apache-2.0
# Derives from Pearl fp8-scheme (ISC), pinned at f696760b259500ecb608469ea3953aeabbe78948.

[package]
name = "pmkcore-v4"
version = "0.1.0"
edition = "2024"
description = "Pearl cert-v4 FP8 pmk core: grid jobs, proofs, and CPU oracle"
publish = false

[lib]
name = "pmkcore_v4"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.98"
base64 = "0.21"
bincode = "1.3.3"
blake3 = "1.8"
getrandom = "0.3"
primitive-types = { version = "0.12.1", features = ["serde"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4.27"
env_logger = "0.10.0"
hashbrown = { version = "0.14.3", default-features = false, features = ["ahash", "serde"] }
itertools = "0.14.0"
lazy_static = "1.4"
rand = "0.9.2"
rand_chacha = "0.9"
serde_with = "3.14.0"
sha2 = "0.10"
sorted-vec = "0.8.10"
pearl-blake3 = { path = "../../vendor/pearl-fp8/pearl-blake3", features = ["serde"] }
plonky2 = { path = "../../vendor/pearl-fp8/plonky2/plonky2" }
plonky2_field = { path = "../../vendor/pearl-fp8/plonky2/field" }
plonky2_maybe_rayon = { path = "../../vendor/pearl-fp8/plonky2/maybe_rayon" }
starky = { path = "../../vendor/pearl-fp8/plonky2/starky" }
layout-macro = { path = "../../vendor/pearl-fp8/zk-pow/src/circuit/layout_macro" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
